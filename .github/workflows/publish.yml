name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the release without publishing'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Release
    uses: sebastienrousseau/config/.github/workflows/reusable-publish.yml@b565e0d215295fe5d67160bb3f5cab78d72abae8 # main
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      # package.json requires Node >=22 (Stylelint 18). On 20 the tests fail
      # with `deprecatedHtmlTypeSelectors.union is not a function`, which
      # stopped the 0.0.9 publish.
      node-version: '22'
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets: inherit
